<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>EduOne - Iniciar Sesión</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />

    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --primary-light: #818cf8;
            --primary-bg: #eef2ff;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-400: #94a3b8;
            --gray-500: #64748b;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1e293b;
            --gray-900: #0f172a;
            --radius: 16px;
            --shadow-lg: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            font-family: var(--font);
            background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            margin: 0;
            overflow-x: hidden;
            overflow-wrap: break-word;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            animation: fadeIn 0.5s ease;
            padding: 8px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-card {
            background: #ffffff;
            border-radius: var(--radius);
            padding: 32px 28px;
            box-shadow: var(--shadow-lg);
        }

        .login-header { text-align: center; margin-bottom: 28px; }

        .login-logo {
            display: flex; align-items: center; justify-content: center;
            gap: 12px; margin-bottom: 6px;
        }

        .login-logo i { font-size: 2.2rem; color: var(--primary); }
        .login-logo h1 { font-size: 1.8rem; font-weight: 700; color: var(--gray-900); }
        .login-subtitle { color: var(--gray-500); font-size: 0.9rem; }

        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block; font-weight: 500; font-size: 0.85rem;
            color: var(--gray-700); margin-bottom: 5px;
        }
        .form-group label i { margin-right: 8px; color: var(--gray-400); width: 18px; }

        .form-control {
            width: 100%; padding: 12px 16px;
            border: 2px solid var(--gray-200); border-radius: 10px;
            font-size: 0.95rem; font-family: var(--font);
            transition: border-color 0.2s, box-shadow 0.2s;
            background: var(--gray-50); color: var(--gray-800);
            -webkit-appearance: none; appearance: none;
        }
        .form-control:focus {
            outline: none; border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
            background: #fff;
        }
        .form-control::placeholder { color: var(--gray-400); }

        .form-options {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; font-size: 0.85rem;
            flex-wrap: wrap; gap: 8px;
        }
        .form-options label {
            display: flex; align-items: center; gap: 8px;
            color: var(--gray-600); cursor: pointer;
        }
        .form-options label input[type="checkbox"] {
            width: 16px; height: 16px;
            accent-color: var(--primary); cursor: pointer; flex-shrink: 0;
        }
        .form-options a {
            color: var(--primary); text-decoration: none;
            font-weight: 500; font-size: 0.85rem;
        }
        .form-options a:hover { color: var(--primary-dark); text-decoration: underline; }

        .btn-primary {
            width: 100%; padding: 14px;
            background: var(--primary); color: #fff;
            border: none; border-radius: 10px;
            font-size: 1rem; font-weight: 600; font-family: var(--font);
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-primary:active { transform: scale(0.98); }
        .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }
        .btn-primary i { font-size: 1.1rem; }

        .btn-back {
            width: 100%; padding: 14px;
            background: transparent; color: var(--gray-500);
            border: 2px solid var(--gray-200); border-radius: 10px;
            font-size: 1rem; font-weight: 500; font-family: var(--font);
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            text-decoration: none;
        }
        .btn-back:hover {
            background: var(--gray-50);
            border-color: var(--gray-300);
            color: var(--gray-700);
        }
        .btn-back:active { transform: scale(0.98); }
        .btn-back i { font-size: 1.1rem; color: var(--gray-400); }
        .btn-back:hover i { color: var(--gray-600); }

        .divider {
            display: flex; align-items: center; gap: 16px;
            margin: 20px 0; color: var(--gray-400); font-size: 0.8rem;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; height: 1px; background: var(--gray-200);
        }

        .login-footer {
            text-align: center; margin-top: 20px;
            color: var(--gray-500); font-size: 0.8rem;
        }

        .alert {
            padding: 12px 16px; border-radius: 10px;
            font-size: 0.9rem; margin-bottom: 16px; display: none;
        }
        .alert.show { display: block; }
        .alert-error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
        .alert-success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
        .alert-info { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
        .alert i { margin-right: 8px; }

        .password-toggle { position: relative; }
        .password-toggle .toggle-eye {
            position: absolute; right: 14px; top: 50%;
            transform: translateY(-50%); background: none; border: none;
            color: var(--gray-400); cursor: pointer;
            font-size: 1.1rem; padding: 4px;
        }
        .password-toggle .toggle-eye:hover { color: var(--gray-600); }

        @media (max-width: 480px) {
            body { padding: 12px; align-items: flex-start; padding-top: 40px; }
            .login-container { padding: 0; max-width: 100%; }
            .login-card { padding: 24px 18px; border-radius: 14px; }
            .login-logo i { font-size: 1.8rem; }
            .login-logo h1 { font-size: 1.5rem; }
            .login-subtitle { font-size: 0.8rem; }
            .form-control { padding: 11px 14px; font-size: 0.9rem; }
            .form-group { margin-bottom: 14px; }
            .form-group label { font-size: 0.8rem; }
            .form-options { font-size: 0.8rem; flex-direction: row; flex-wrap: wrap; }
            .btn-primary, .btn-back { padding: 13px; font-size: 0.95rem; }
            .divider { margin: 16px 0; font-size: 0.75rem; }
            .login-footer { font-size: 0.7rem; margin-top: 16px; }
            .alert { padding: 10px 14px; font-size: 0.8rem; }
        }

        @media (max-width: 360px) {
            .login-card { padding: 18px 14px; }
            .login-logo h1 { font-size: 1.3rem; }
            .form-control { padding: 10px 12px; font-size: 0.85rem; }
            .btn-primary, .btn-back { padding: 11px; font-size: 0.85rem; }
            .form-options { font-size: 0.75rem; flex-direction: column; align-items: flex-start; gap: 6px; }
        }

        @media (min-width: 481px) and (max-width: 768px) {
            .login-card { padding: 32px 28px; }
        }

        .spinner {
            display: inline-block; width: 20px; height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3); border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s ease-in-out infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">

            <div class="login-header">
                <div class="login-logo">
                    <i class="fas fa-graduation-cap"></i>
                    <h1>EduOne</h1>
                </div>
                <p class="login-subtitle">Plataforma de Gestión Escolar</p>
            </div>

            <div id="alertMessage" class="alert">
                <i class="fas fa-info-circle"></i>
                <span id="alertText">Mensaje de error</span>
            </div>

            <form id="loginForm" autocomplete="off">
                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i> Correo electrónico
                    </label>
                    <input type="email" id="email" class="form-control" placeholder="admin@eduone.com" required autofocus />
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Contraseña
                    </label>
                    <div class="password-toggle">
                        <input type="password" id="password" class="form-control" placeholder="••••••••" required />
                        <button type="button" class="toggle-eye" id="togglePassword" aria-label="Mostrar contraseña">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label>
                        <input type="checkbox" id="rememberMe" />
                        Recordarme
                    </label>
                    <a href="#">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn-primary" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i>
                    Iniciar sesión
                </button>
            </form>

            <div class="divider"><span>o</span></div>

            <a href="index.html" class="btn-back">
                <i class="fas fa-arrow-left"></i>
                Volver al inicio
            </a>

            <div class="login-footer">
                &copy; 2027 EduOne - Todos los derechos reservados
            </div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/11.3.1/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/11.3.1/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/11.3.1/firebase-firestore.js"
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from "firebase/app";
        import {
            getAuth, signInWithEmailAndPassword,
            setPersistence, browserLocalPersistence, browserSessionPersistence,
            onAuthStateChanged, signOut
        } from "firebase/auth";
        import { getFirestore, doc, getDoc } from "firebase/firestore";

        const firebaseConfig = {
            apiKey: "AIzaSyA3U98y5BJWQwpypFCAyNioqSRfXkr9UA0",
            authDomain: "eduone-5f7cf.firebaseapp.com",
            projectId: "eduone-5f7cf",
            storageBucket: "eduone-5f7cf.firebasestorage.app",
            messagingSenderId: "541282614006",
            appId: "1:541282614006:web:f8cf617c99f08403df0ad7",
            measurementId: "G-Y2P0EMNYCL"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const alertMessage = document.getElementById('alertMessage');
        const alertText = document.getElementById('alertText');
        const rememberMe = document.getElementById('rememberMe');
        const togglePasswordBtn = document.getElementById('togglePassword');

        // =============================================
        // MAPA DE RUTAS POR ROL
        // =============================================
        const RUTAS = {
            superadmin: 'PanelAdmin/AdminPanel.html',
            rector: 'colegios/colegio.html',
            admin_colegio: 'colegios/colegio.html',
            admin_auxiliar: 'colegios/colegio.html',
            profesor: 'colegios/profesor.html',
            estudiante: 'colegios/estudiante.html',
            acudiente: 'colegios/acudiente.html',
            contador: 'contador.html',
            coord_academico: 'colegios/coordinador-academico.html',
            coord_convivencia: 'colegios/coordinador-convivencia.html',
            secretaria: 'colegios/secretaria.html',
            orientador: 'colegios/orientador.html'
        };

        // Alias de roles: variantes que deben ir al mismo panel
        const ALIAS_ROLES = {
            'secretario': 'secretaria',
            'secretaría': 'secretaria',
            'secretaria_academica': 'secretaria',
            'administrador': 'rector',
            'director': 'rector'
        };

        // =============================================
        // NORMALIZAR ROL
        // =============================================
        function normalizarRol(rol) {
            if (!rol) return null;
            const limpio = String(rol).toLowerCase().trim();
            return ALIAS_ROLES[limpio] || limpio;
        }

        // =============================================
        // REDIRECCIÓN POR ROL
        // =============================================
        let isRedirecting = false;

        function redirigirSegunRol(rolOriginal) {
            const rol = normalizarRol(rolOriginal);

            console.log(`🔀 Redirigiendo: rol="${rolOriginal}" (normalizado="${rol}")`);

            if (!rol) {
                showAlert('⛔ Tu usuario no tiene un rol asignado. Contacta al administrador.', 'error');
                return false;
            }

            const ruta = RUTAS[rol];
            if (ruta) {
                isRedirecting = true;
                console.log(`✅ Rol reconocido. Yendo a: ${ruta}`);
                window.location.href = ruta;
                return true;
            }

            console.warn(`⚠️ Rol no reconocido: ${rol}`);
            showAlert(`⛔ El rol "${rol}" no tiene un panel asignado. Contacta al administrador.`, 'error');
            return false;
        }

        // =============================================
        // ALERTAS
        // =============================================
        function showAlert(message, type = 'error') {
            alertMessage.className = `alert alert-${type} show`;
            alertText.textContent = message;
        }

        function hideAlert() {
            alertMessage.className = 'alert';
            alertMessage.classList.remove('show');
        }

        // =============================================
        // TOGGLE PASSWORD
        // =============================================
        togglePasswordBtn.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            const icon = togglePasswordBtn.querySelector('i');
            icon.className = type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
        });

        // =============================================
        // VERIFICAR SESIÓN ACTIVA (solo al cargar)
        // =============================================
        let sesionInicialVerificada = false;

        onAuthStateChanged(auth, async (user) => {
            // Si ya estamos redirigiendo, no hacer nada
            if (isRedirecting) return;
            // Si ya verificamos una vez, no repetir (evita doble redirección)
            if (sesionInicialVerificada) return;
            sesionInicialVerificada = true;

            if (user) {
                console.log('👤 Sesión activa detectada:', user.uid);
                try {
                    const userDoc = await getDoc(doc(db, 'usuarios', user.uid));
                    if (userDoc.exists()) {
                        const data = userDoc.data();
                        if (data.activo === true) {
                            redirigirSegunRol(data.rol);
                        } else {
                            console.warn('⚠️ Usuario inactivo');
                            await signOut(auth);
                        }
                    } else {
                        console.warn('⚠️ Usuario no existe en Firestore');
                    }
                } catch (error) {
                    console.error('❌ Error al verificar usuario:', error);
                }
            } else {
                console.log('👤 No hay sesión activa');
            }
        });

        // =============================================
        // LOGIN
        // =============================================
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlert();

            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (!email || !password) {
                showAlert('Por favor, completa todos los campos.', 'error');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner"></span> Iniciando sesión...';

            try {
                const persistence = rememberMe.checked
                    ? browserLocalPersistence
                    : browserSessionPersistence;
                await setPersistence(auth, persistence);

                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                console.log('✅ Login exitoso:', user.uid);

                const userDoc = await getDoc(doc(db, 'usuarios', user.uid));

                if (!userDoc.exists()) {
                    // ⚠️ SEGURIDAD: NO crear usuario automáticamente.
                    // Un usuario de Auth sin documento en Firestore no debe poder entrar.
                    console.warn('⚠️ Usuario Auth sin doc en Firestore');
                    showAlert('⛔ Tu cuenta no está registrada en el sistema. Contacta al administrador.', 'error');
                    await signOut(auth);
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Iniciar sesión';
                    return;
                }

                const data = userDoc.data();
                console.log('📋 Datos del usuario:', { rol: data.rol, activo: data.activo, colegioId: data.colegioId });

                if (data.activo !== true) {
                    showAlert('⛔ Tu cuenta está desactivada. Contacta al administrador.', 'error');
                    await signOut(auth);
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Iniciar sesión';
                    return;
                }

                showAlert('✅ Inicio de sesión exitoso. Redirigiendo...', 'success');

                // Guardar email si marcó "recordarme"
                if (rememberMe.checked) {
                    localStorage.setItem('eduone_email', email);
                } else {
                    localStorage.removeItem('eduone_email');
                }

                const ok = redirigirSegunRol(data.rol);
                if (!ok) {
                    // Si la redirección falló (rol desconocido), reactivar el botón
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Iniciar sesión';
                }

            } catch (error) {
                console.error('❌ Error al iniciar sesión:', error);

                let mensaje = 'Error al iniciar sesión.';
                switch (error.code) {
                    case 'auth/user-not-found':
                        mensaje = '❌ Usuario no encontrado.';
                        break;
                    case 'auth/wrong-password':
                        mensaje = '❌ Contraseña incorrecta. Intenta de nuevo.';
                        break;
                    case 'auth/invalid-credential':
                        mensaje = 'El usuario o contraseña son inválidos.';
                        break;
                    case 'auth/invalid-email':
                        mensaje = '❌ Correo electrónico inválido.';
                        break;
                    case 'auth/too-many-requests':
                        mensaje = '⚠️ Demasiados intentos fallidos. Espera un momento.';
                        break;
                    default:
                        mensaje = `❌ Error: ${error.message}`;
                }
                showAlert(mensaje, 'error');

                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Iniciar sesión';
            }
        });

        // =============================================
        // GUARDAR EMAIL EN LOCALSTORAGE
        // =============================================
        const savedEmail = localStorage.getItem('eduone_email');
        if (savedEmail) {
            emailInput.value = savedEmail;
            rememberMe.checked = true;
        }

        console.log('✅ EduOne - Login cargado correctamente');
        console.log('📁 Rutas disponibles:', Object.keys(RUTAS));
    </script>

</body>
</html
